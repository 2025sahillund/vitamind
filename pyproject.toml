[project]
name = "vitamind"
version = "0.1.0"
description = "Voice-first continuous health and habit tracking agent with temporal trend detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: live external integration tests requiring real API credentials"
]
